<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBÜ Not Hesaplayıcı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Not Hesaplayıcı</h1>
        <p class="subtitle">Vize ve sınav bilgilerinizi girerek notunuzu hesaplayın. <br>Karabük Üniversitesi Standartlarında.</p>

        <div class="input-group">
            <label>Vize Notu (0–100)</label>
            <input type="number" id="vize" placeholder="Giriniz" max="100" min="0">
        </div>

        <div class="input-group">
            <label>Yıl İçi Çalışma (Opsiyonel)</label>
            <input type="number" id="yilIci" placeholder="Opsiyonel">
        </div>

        <div class="input-group">
            <label>Final Notu</label>
            <input type="number" id="final" placeholder="Giriniz" max="100" min="0">
        </div>

        <div class="input-group">
            <label>Bütünleme Notu (Varsa final yerine geçer)</label>
            <input type="number" id="butunleme" placeholder="Yok" max="100" min="0">
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" id="devamsiz"> Devamsızım (F1)</label>
        </div>

        <div class="input-group">
            <label>Sınava Girdiniz mi?</label>
            <select id="sinavDurumu">
                <option value="evet">Evet</option>
                <option value="hayir">Hayır (F2)</option>
            </select>
        </div>

        <div id="hata" class="error hidden"></div>

        <div class="btn-group">
            <button id="hesaplaBtn">Hesapla</button>
            <button id="sifirlaBtn" class="secondary">Sıfırla</button>
        </div>

        <div id="sonuc" class="result hidden">
            <p><strong>Başarı Notu:</strong> <span id="resBasari">-</span></p>
            <p><strong>Harf Notu:</strong> <span id="resHarf">-</span></p>
            <p><strong>Durum:</strong> <span id="resDurum">-</span></p>
            <p><strong>Açıklama:</strong> <span id="resAciklama">-</span></p>
        </div>
    </div>

    <script src="kod.js"></script>
</body>
</html>
